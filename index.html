<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEAVISTA</title>
<meta name="description" content="SEAVISTA, a research project at FORTH-ICS and CVRL, co-funded by Frontex under the Frontex Research Grants Programme.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  /*
   * Three styles over one content. data-style on <html> picks the tokens and
   * which hero is shown; everything else is shared.
   *   console  the videos' own Ops Console palette, the thesis set as three steps
   *   dossier  a research report: paper, ink, the institutes' marks as issued
   *   reel     the videos first: the overview plays as the hero
   */
  :root {
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --serif: "IBM Plex Serif", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --max: 1180px;
    --bg: #080c13; --panel: #111824; --line: #1f2a38; --fg: #e8eef6; --dim: #9fb0c4; --faint: #708297;
    --acc: #3d8bff; --accText: #7fb0ff; --warm: #ffb23d; --plate: #e9eef5; --plateFg: #0d1b2a; --foot: #050810;
    --display: var(--sans); --body: var(--sans);
    color-scheme: dark;
  }
  :root[data-style="dossier"] {
    --bg: #fbfbf8; --panel: #ffffff; --line: #d9dde3; --fg: #14202e; --dim: #475668; --faint: #6b7889;
    --acc: #1f5fbf; --accText: #1f5fbf; --warm: #b8650a; --plate: #ffffff; --plateFg: #14202e; --foot: #eef1f4;
    --display: var(--serif); --body: var(--serif);
    color-scheme: light;
  }
  :root[data-style="reel"] {
    --bg: #000000; --panel: #0b0d10; --line: #1d2229; --fg: #f2f4f7; --dim: #a7b0bc; --faint: #788392;
    --acc: #3d8bff; --accText: #8bb8ff; --plate: #e9eef5; --plateFg: #0d1b2a; --foot: #000000;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 var(--body); }
  a { color: var(--accText); }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .wrap { max-width: var(--max); margin: 0 auto; padding-inline: 16px; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; }
  [data-hero] { display: none; }
  :root[data-style="console"] [data-hero="console"],
  :root[data-style="dossier"] [data-hero="dossier"],
  :root[data-style="reel"] [data-hero="reel"] { display: block; }

  /* the picker: preview furniture, fixed bottom right */
  .picker { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10;
            display: flex; flex-wrap: wrap; gap: 10px; padding: 8px; background: rgba(20,28,40,.92); border: 1px solid #3a4a60;
            font: 600 13px var(--sans); color: #e8eef6; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .picker div { display: flex; gap: 2px; }
  .picker button { font: inherit; color: #e8eef6; background: transparent; border: 1px solid #4a5b72; padding: 5px 10px; cursor: pointer; }
  .picker button[aria-pressed="true"] { background: #e8eef6; color: #0d1b2a; border-color: #e8eef6; }

  /* ---------------------------------------------------------------- console */
  .h-console { padding-block: clamp(48px, 9vw, 120px) 40px; border-bottom: 1px solid var(--line);
               background: radial-gradient(ellipse 70% 90% at 80% 10%, #10203a 0%, transparent 70%); }
  .h-console h1 { margin: 0; font-size: clamp(48px, 10vw, 128px); line-height: .95; font-weight: 700; letter-spacing: .01em; }
  .h-console .sub { margin: 14px 0 0; font-size: clamp(20px, 2.6vw, 30px); font-weight: 600; }
  .steps { list-style: none; margin: 48px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
           background: var(--line); border: 1px solid var(--line); counter-reset: s; }
  .steps li { background: var(--panel); padding: 22px 22px 24px; min-width: 0; counter-increment: s; }
  .steps li::before { content: counter(s); font: 500 14px var(--mono); color: var(--accText); display: block; margin-bottom: 14px; }
  .steps .what { font-size: 21px; font-weight: 600; line-height: 1.3; }
  .steps .fig { font: 400 40px/1.1 var(--mono); margin: 16px 0 4px; }
  .steps .d { font-size: 14px; color: var(--dim); line-height: 1.45; }
  .steps li:last-child .fig { color: var(--warm); }
  @media (prefers-reduced-motion: no-preference) {
    .steps li { animation: step .7s cubic-bezier(.2,.7,.2,1) both; }
    .steps li:nth-child(2) { animation-delay: .9s; }
    .steps li:nth-child(3) { animation-delay: 1.8s; }
    @keyframes step { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }

  /* ---------------------------------------------------------------- dossier */
  .h-dossier { padding-block: 28px 8px; }
  .h-dossier .marks { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 44px; padding-bottom: 22px;
                      border-bottom: 2px solid var(--fg); }
  .h-dossier .marks img { height: 64px; width: auto; display: block; }
  .h-dossier .head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 32px 48px; padding-top: 40px; }
  .h-dossier h1 { margin: 0; font-size: clamp(46px, 7.5vw, 92px); line-height: 1; font-weight: 600; letter-spacing: -.01em; }
  .h-dossier .sub { margin: 14px 0 0; font: italic 400 clamp(20px, 2.4vw, 28px)/1.3 var(--serif); color: var(--dim); }
  .h-dossier figure { margin: 0; }
  .h-dossier figure img { width: 100%; display: block; border: 1px solid var(--line); background: #080c13; }
  .h-dossier figcaption { font: 14px/1.45 var(--sans); color: var(--dim); margin-top: 10px; }
  .h-dossier figcaption b { color: var(--fg); font-weight: 600; }
  :root[data-style="dossier"] .about p, :root[data-style="dossier"] .card p { font-size: 18px; line-height: 1.7; }
  :root[data-style="dossier"] .builders { display: none; }
  footer img.light { display: none; }
  :root[data-style="dossier"] footer img.light { display: block; }
  :root[data-style="dossier"] footer img.dark { display: none; }

  /* ------------------------------------------------------------------- reel */
  .h-reel { padding-block: 0 8px; }
  .h-reel .stage { position: relative; max-width: 1600px; margin: 0 auto; aspect-ratio: 16 / 9; max-height: 82vh; background: #000; }
  .h-reel video { width: 100%; height: 100%; display: block; object-fit: contain; }
  .h-reel .bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 24px; padding-block: 22px 0; }
  .h-reel h1 { margin: 0; font-size: clamp(34px, 5vw, 56px); line-height: 1; font-weight: 700; }
  .h-reel .sub { margin: 0; font-size: clamp(17px, 1.8vw, 22px); color: var(--dim); flex: 1 1 18em; min-width: 0; }
  .h-reel button.sound { font: 600 15px var(--sans); color: var(--bg); background: var(--fg); border: 0; padding: 10px 18px; cursor: pointer; }
  :root[data-style="reel"] .figs { display: none; }
  :root[data-style="reel"] .grid { grid-template-columns: 1fr; gap: 40px; }
  :root[data-style="reel"] .card { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); background: none; border: 0; }
  :root[data-style="reel"] .card .body { padding: 6px 0 0 28px; }
  :root[data-style="reel"] .card h3 { font-size: 28px; }

  /* ----------------------------------------------------------------- shared */
  section { padding-block: 48px 8px; }
  h2 { font: 600 15px var(--sans); color: var(--accText); margin: 0 0 18px; }
  .about p { margin: 0 0 16px; max-width: 40em; }
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line);
          border: 1px solid var(--line); margin: 8px 0 0; }
  .figs > div { background: var(--panel); padding: 16px 18px; }
  .figs .k { font: 600 13px var(--sans); color: var(--faint); }
  .figs .v { font: 30px/1.2 var(--mono); margin: 6px 0 4px; }
  .figs .d { font: 14px/1.4 var(--sans); color: var(--dim); }
  :root[data-style="console"] .figs { display: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); min-width: 0; }
  .card .media { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; cursor: pointer; }
  .card .media video, .card .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .media.full video { object-fit: contain; }
  .card .play { position: absolute; left: 14px; bottom: 12px; font: 600 13px var(--sans); color: #f2f4f7;
                background: rgba(5,8,16,.82); border: 1px solid #3d8bff; padding: 5px 12px; }
  .card .media.full { cursor: default; }
  .card .body { padding: 14px 18px 18px; }
  .card h3 { margin: 0 0 6px; font-size: 21px; font-weight: 600; }
  .card .len { font: 13px var(--mono); color: var(--faint); margin-left: 8px; font-weight: 400; }
  .card p { margin: 0; color: var(--dim); font-size: 15px; }
  .note { color: var(--faint); font: 14px var(--sans); margin: 14px 0 0; }

  .builders { margin-top: 48px; padding: 28px; background: var(--plate); color: var(--plateFg);
              display: flex; flex-wrap: wrap; align-items: center; gap: 20px 48px; }
  .builders .marks { display: flex; flex-wrap: wrap; align-items: center; gap: 24px 48px; }
  .builders .marks img { height: 72px; width: auto; display: block; }
  .builders p { margin: 0; flex: 1 1 22em; min-width: 0; font: 15px/1.55 var(--sans); }
  .built-text { display: none; }
  :root[data-style="dossier"] .built-text { display: block; color: var(--dim); }

  footer { margin-top: 56px; background: var(--foot); border-top: 1px solid var(--line); }
  footer .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; padding-block: 22px 80px; }
  footer .fundline { color: var(--dim); font: 14px var(--sans); max-width: 34em; }
  footer img { height: 34px; display: block; margin-left: auto; }
  @media (max-width: 760px) {
    .steps { grid-template-columns: 1fr; }
    .h-dossier .head { grid-template-columns: 1fr; }
    .h-dossier .marks img, .builders .marks img { height: 48px; }
    .grid { grid-template-columns: 1fr; }
    :root[data-style="reel"] .card { grid-template-columns: 1fr; }
    :root[data-style="reel"] .card .body { padding: 14px 0 0; }
    footer img { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="picker" role="group" aria-label="Preview">
  <div><button data-style="console">Console</button><button data-style="dossier">Dossier</button><button data-style="reel">Reel</button></div>
  <div><button data-lang="el">ΕΛ</button><button data-lang="en">EN</button></div>
</div>

<header data-hero="console" class="h-console">
  <div class="wrap">
    <h1>SEAVISTA</h1>
    <p class="sub" data-t="hero_h"></p>
    <ol class="steps">
      <li><div class="what" data-t="s1"></div><div class="fig">6,000/s</div><div class="d" data-t="s1d"></div></li>
      <li><div class="what" data-t="s2"></div><div class="fig">84s</div><div class="d" data-t="s2d"></div></li>
      <li><div class="what" data-t="s3"></div><div class="fig">0</div><div class="d" data-t="s3d"></div></li>
    </ol>
  </div>
</header>

<header data-hero="dossier" class="h-dossier">
  <div class="wrap">
    <div class="marks">
      <img src="assets/FORTH-ICS.png" alt="FORTH-ICS">
      <img src="assets/CVRL.png" alt="CVRL">
    </div>
    <div class="head">
      <div>
        <h1>SEAVISTA</h1>
        <p class="sub" data-t="hero_h"></p>
      </div>
      <figure>
        <img src="loops/seas.jpg" alt="">
        <figcaption><b data-t="fig_n"></b> <span data-t="fig_c"></span></figcaption>
      </figure>
    </div>
  </div>
</header>

<header data-hero="reel" class="h-reel">
  <div class="stage">
    <video id="reel" src="media/hub.mp4" poster="media/hub.jpg" muted playsinline preload="metadata"></video>
  </div>
  <div class="wrap">
    <div class="bar">
      <h1>SEAVISTA</h1>
      <p class="sub" data-t="hero_p"></p>
      <button class="sound" id="sound" data-t="sound"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="about">
    <h2 data-t="about_h"></h2>
    <p data-t="about_1"></p>
    <p data-t="about_2"></p>
    <div class="figs">
      <div><div class="k" data-t="f1k"></div><div class="v">6,000/s</div><div class="d" data-t="f1d"></div></div>
      <div><div class="k" data-t="f2k"></div><div class="v">84s</div><div class="d" data-t="f2d"></div></div>
      <div><div class="k" data-t="f3k"></div><div class="v">0</div><div class="d" data-t="f3d"></div></div>
      <div><div class="k" data-t="f4k"></div><div class="v">&lt;4h</div><div class="d" data-t="f4d"></div></div>
    </div>
    <p class="built-text" data-t="built"></p>
  </section>

  <section>
    <h2 data-t="videos_h"></h2>
    <div class="grid" id="videos"></div>
    <p class="note" data-t="videos_note"></p>
  </section>

  <section class="builders">
    <div class="marks">
      <img src="assets/FORTH-ICS.png" alt="FORTH-ICS">
      <img src="assets/CVRL.png" alt="CVRL">
    </div>
    <p data-t="built"></p>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="fundline" data-t="funding"></span>
    <img class="frontex dark" src="assets/FRONTEX-rev.png" alt="Frontex">
    <img class="frontex light" src="assets/FRONTEX.png" alt="Frontex">
  </div>
</footer>

<script>
const T = {
  en: {
    hero_h: "One officer. One sea.",
    hero_p: "Every vessel at sea, scored. The few worth a look, investigated before an officer sees them.",
    s1: "Every vessel is scored, with every position report it sends.",
    s1d: "vessel updates a second, each a full pass through the models, on one workstation",
    s2: "An AI agent investigates what stands out, and writes the case.",
    s2d: "median time from the signal to an investigated case in front of a person",
    s3: "The officer decides, on a list worth working.",
    s3d: "false alarms reached the officer, across 72 and 69 cases of ordinary traffic",
    fig_n: "Figure 1.",
    fig_c: "One model, trained on four national sea areas at once. A new sea area is added in under four hours.",
    sound: "Watch with sound",
    about_h: "The project",
    about_1: "SEAVISTA scores every vessel with each position report it sends, against a model of how ships normally move, learned from recorded traffic. An AI agent investigates what those scores raise and hands the officer a case that is already explained, with the reasons it cites and what would have changed the call. The officer makes the call on every case.",
    about_2: "One workstation carries about 6,000 vessel updates a second. An alert reached a person in a median of 84 seconds, and across 72 and 69 cases of ordinary traffic no false alarm reached the officer. One model learned four national sea areas at once, and a new sea area is added in under four hours.",
    f1k: "Throughput", f1d: "vessel updates a second, every one a full pass through the models, on one workstation",
    f2k: "Latency", f2d: "median time from the signal to an investigated case in front of a person",
    f3k: "Quiet", f3d: "false alarms reaching the officer, across 72 and 69 cases of ordinary traffic",
    f4k: "New sea area", f4d: "to fold a new sea area into the models, on one workstation",
    videos_h: "The videos",
    videos_note: "The videos are in English, with the captions burned in, so they also play muted.",
    play: "▶ Play",
    built: "SEAVISTA was built at the Computational Vision and Robotics Laboratory (CVRL) of the Institute of Computer Science, FORTH. Danish waters are the example throughout. Other sea areas are added the same way.",
    funding: "Co-funded by Frontex under the Frontex Research Grants Programme",
  },
  el: {
    hero_h: "Ένας αξιωματικός. Μία θάλασσα.",
    hero_p: "Κάθε σκάφος στη θάλασσα βαθμολογείται. Οι λίγες υποθέσεις που αξίζουν προσοχή διερευνώνται πριν τις δει ο αξιωματικός.",
    s1: "Κάθε σκάφος βαθμολογείται, με κάθε αναφορά θέσης που στέλνει.",
    s1d: "ενημερώσεις σκαφών το δευτερόλεπτο, καθεμία με πλήρη διέλευση από τα μοντέλα, σε έναν σταθμό εργασίας",
    s2: "Ένας πράκτορας τεχνητής νοημοσύνης διερευνά ό,τι ξεχωρίζει και συντάσσει την υπόθεση.",
    s2d: "διάμεσος χρόνος από το σήμα ως μια διερευνημένη υπόθεση μπροστά σε άνθρωπο",
    s3: "Ο αξιωματικός αποφασίζει, σε μια λίστα που αξίζει τον χρόνο του.",
    s3d: "ψευδείς συναγερμοί έφτασαν στον αξιωματικό, σε 72 και 69 περιπτώσεις συνήθους κίνησης",
    fig_n: "Εικόνα 1.",
    fig_c: "Ένα μοντέλο, εκπαιδευμένο ταυτόχρονα σε τέσσερις εθνικές θαλάσσιες περιοχές. Μια νέα περιοχή προστίθεται σε λιγότερο από τέσσερις ώρες.",
    sound: "Με ήχο",
    about_h: "Το έργο",
    about_1: "Το SEAVISTA βαθμολογεί κάθε σκάφος με κάθε αναφορά θέσης που στέλνει, σε σχέση με ένα μοντέλο του πώς κινούνται συνήθως τα πλοία, που έχει μάθει από καταγεγραμμένη κίνηση. Ένας πράκτορας τεχνητής νοημοσύνης διερευνά ό,τι ξεχωρίζουν οι βαθμολογίες και παραδίδει στον αξιωματικό μια υπόθεση ήδη τεκμηριωμένη, με τους λόγους που την στηρίζουν και με το τι θα άλλαζε την εκτίμηση. Την απόφαση για κάθε υπόθεση την παίρνει ο αξιωματικός.",
    about_2: "Ένας σταθμός εργασίας επεξεργάζεται περίπου 6.000 ενημερώσεις σκαφών το δευτερόλεπτο. Μια ειδοποίηση έφτασε σε άνθρωπο σε διάμεσο χρόνο 84 δευτερολέπτων, και σε 72 και 69 περιπτώσεις συνήθους κίνησης κανένας ψευδής συναγερμός δεν έφτασε στον αξιωματικό. Ένα ενιαίο μοντέλο εκπαιδεύτηκε ταυτόχρονα σε τέσσερις εθνικές θαλάσσιες περιοχές, και μια νέα περιοχή προστίθεται σε λιγότερο από τέσσερις ώρες.",
    f1k: "Ρυθμός", f1d: "ενημερώσεις σκαφών το δευτερόλεπτο, καθεμία με πλήρη διέλευση από τα μοντέλα, σε έναν σταθμό εργασίας",
    f2k: "Χρόνος", f2d: "διάμεσος χρόνος από το σήμα ως μια διερευνημένη υπόθεση μπροστά σε άνθρωπο",
    f3k: "Ησυχία", f3d: "ψευδείς συναγερμοί προς τον αξιωματικό, σε 72 και 69 περιπτώσεις συνήθους κίνησης",
    f4k: "Νέα περιοχή", f4d: "για να ενταχθεί μια νέα θαλάσσια περιοχή στα μοντέλα, σε έναν σταθμό εργασίας",
    videos_h: "Τα βίντεο",
    videos_note: "Τα βίντεο είναι στα αγγλικά, με ενσωματωμένους υπότιτλους, ώστε να παίζουν και χωρίς ήχο.",
    play: "▶ Αναπαραγωγή",
    built: "Το SEAVISTA αναπτύχθηκε στο Εργαστήριο Υπολογιστικής Όρασης και Ρομποτικής (CVRL) του Ινστιτούτου Πληροφορικής του ΙΤΕ. Τα ύδατα της Δανίας είναι παντού το παράδειγμα. Άλλες θαλάσσιες περιοχές προστίθενται με τον ίδιο τρόπο.",
    funding: "Συγχρηματοδοτείται από τον Frontex στο πλαίσιο του Frontex Research Grants Programme",
  },
};

// state lives in the URL hash as one bare token (#dossier-el), the only thing an artifact link carries
const STYLES = ["console", "dossier", "reel"], LANGS = ["el", "en"];
const fromHash = () => (location.hash.slice(1) || "").split("-");
let style = fromHash().find((x) => STYLES.includes(x)) || "console";
let lang = fromHash().find((x) => LANGS.includes(x)) || ((navigator.language || "").startsWith("el") ? "el" : "en");
let manifest = null;
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;

function render() {
  const root = document.documentElement;
  root.lang = lang; root.dataset.style = style;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = T[lang][el.dataset.t];
  for (const b of document.querySelectorAll(".picker button"))
    b.setAttribute("aria-pressed", b.dataset.style === style || b.dataset.lang === lang);
  const reel = document.getElementById("reel");
  if (style === "reel") { if (reel.paused && reel.muted) reel.play().catch(() => {}); } else reel.pause();
  try { history.replaceState(null, "", "#" + style + "-" + lang); } catch {}
  if (!manifest) return;
  for (const v of manifest.videos) {
    const card = document.getElementById("v-" + v.id);
    card.querySelector("h3 .t").textContent = v.title[lang];
    card.querySelector("p").textContent = v.blurb[lang];
    const play = card.querySelector(".play"); if (play) play.textContent = T[lang].play;
  }
}

async function load() {
  manifest = await (await fetch("videos.json")).json();
  const grid = document.getElementById("videos");
  for (const v of manifest.videos) {
    const meta = await fetch(`media/${v.id}.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    const card = document.createElement("article");
    card.className = "card"; card.id = "v-" + v.id;
    card.innerHTML = `<div class="media"><img src="media/${v.id}.jpg" alt=""><span class="play"></span></div>
      <div class="body"><h3><span class="t"></span>${meta ? `<span class="len">${mmss(meta.seconds)}</span>` : ""}</h3><p></p></div>`;
    card.querySelector(".media").addEventListener("click", (e) => {
      const m = e.currentTarget; if (m.classList.contains("full")) return;
      for (const other of document.querySelectorAll("video")) other.pause();
      m.classList.add("full");
      m.innerHTML = `<video src="media/${v.id}.mp4" poster="media/${v.id}.jpg" controls autoplay playsinline preload="auto"></video>`;
    });
    grid.append(card);
  }
  render();
}

for (const b of document.querySelectorAll(".picker button"))
  b.addEventListener("click", () => { if (b.dataset.style) style = b.dataset.style; if (b.dataset.lang) lang = b.dataset.lang; render(); });
document.getElementById("sound").addEventListener("click", () => {
  const v = document.getElementById("reel");
  v.muted = false; v.controls = true; v.currentTime = 0; v.play().catch(() => {});
});
render(); load();
</script>
</body>
</html>
