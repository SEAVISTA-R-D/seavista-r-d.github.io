<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEAVISTA</title>
<meta name="description" content="SEAVISTA, a research project at FORTH-ICS and CVRL, co-funded by Frontex under the Frontex Research Grants Programme.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  /* The videos' own Ops Console palette (remotion/src/theme.ts). The page ground is the videos' ground,
     so a graphic lifted from a slide melts into it at the edges instead of sitting in a box.
     Layout: one story, told in rows; text and graphic trade columns on every turn. */
  :root {
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --max: 1240px;
    --bg: #080c13; --line: #1f2a38; --fg: #e8eef6; --dim: #9fb0c4; --faint: #708297;
    --acc: #3d8bff; --accText: #7fb0ff; --warm: #ffb23d;
    --plate: #e9eef5; --plateFg: #0d1b2a; --foot: #050810;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.65 var(--sans); }
  a { color: var(--accText); }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .wrap { max-width: var(--max); margin: 0 auto; padding-inline: 16px; }
  h1, h2, h3 { text-wrap: balance; }

  .lang { position: absolute; top: 16px; right: 16px; z-index: 2; display: flex; gap: 2px; }
  .lang button { font: 600 13px var(--sans); color: var(--fg); background: rgba(5,8,16,.7); border: 1px solid var(--faint);
                 padding: 4px 9px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* ------------------------------------------------------------------- hero */
  .hero { border-top: 3px solid var(--acc); padding-block: clamp(56px, 9vw, 128px) clamp(24px, 4vw, 48px); }
  .hero h1 { margin: 0; font-size: clamp(52px, 10vw, 136px); line-height: .92; font-weight: 700; letter-spacing: .01em; }
  .hero .claim { margin: 22px 0 0; font-size: clamp(24px, 3vw, 38px); line-height: 1.2; font-weight: 600; max-width: 22em; }
  .hero .lead { margin: 18px 0 0; color: var(--dim); font-size: clamp(17px, 1.5vw, 20px); max-width: 38em; }

  /* ------------------------------------------------------------------ story */
  .story { display: grid; gap: clamp(48px, 8vw, 112px); padding-block: clamp(32px, 5vw, 64px); }
  .turn { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px clamp(24px, 4vw, 64px); align-items: center; }
  .turn:nth-child(even) { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
  .turn:nth-child(even) .text { order: 2; }
  .turn h2 { margin: 0 0 12px; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.15; font-weight: 600; }
  .turn p { margin: 0 0 14px; max-width: 34em; }
  .turn p:last-child { margin-bottom: 0; }
  .turn figure { margin: 0; min-width: 0; }
  .turn figure img { display: block; width: 100%; height: auto; max-width: 100%;
    /* fade every edge into the page, so the slide has no frame */
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
                        linear-gradient(to bottom, transparent 0, #000 9%, #000 91%, transparent 100%);
    -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
                        linear-gradient(to bottom, transparent 0, #000 9%, #000 91%, transparent 100%);
            mask-composite: intersect; }
  .turn figcaption { margin-top: 6px; font-size: 14px; color: var(--faint); padding-inline: 7%; }
  .turn figcaption button { all: unset; cursor: pointer; color: var(--accText); }
  .turn figcaption button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  .cta { margin-top: 28px; font: 600 16px var(--sans); color: var(--bg); background: var(--fg); border: 0; padding: 12px 20px; cursor: pointer; }
  .cta .len { font: 14px var(--mono); margin-left: 8px; opacity: .7; }

  /* ----------------------------------------------------------------- videos */
  /* the journey: the overview first and large, then the deep dives, each tied to the turn it expands */
  #overview .video { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 20px 40px; align-items: center; }
  #overview .video h3 { margin-top: 0; font-size: clamp(26px, 2.6vw, 34px); }
  #overview .video p { font-size: 17px; max-width: 30em; }
  h2.label.deep { margin-top: 64px; margin-bottom: 6px; }
  .deep-intro { margin: 0 0 22px; color: var(--dim); font-size: 16px; max-width: 40em; }
  section { padding-block: 56px 8px; }
  h2.label { font: 600 15px var(--sans); color: var(--accText); margin: 0 0 20px; }
  .videos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 28px; }
  .video { min-width: 0; }
  .video .media { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; cursor: pointer; }
  .video .media img, .video .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .video .media.full video { object-fit: contain; }
  .video .media.full { cursor: default; }
  .video .play { position: absolute; left: 12px; bottom: 10px; font: 600 13px var(--sans); color: var(--fg);
                 background: rgba(5,8,16,.82); border: 1px solid var(--acc); padding: 4px 11px; }
  .video h3 { margin: 12px 0 4px; font-size: 19px; font-weight: 600; }
  .video .len { font: 13px var(--mono); color: var(--faint); margin-left: 8px; font-weight: 400; }
  .video p { margin: 0; color: var(--dim); font-size: 15px; line-height: 1.5; }
  .note { color: var(--faint); font-size: 14px; margin: 18px 0 0; }

  /* the player: a dialog over the page, closed by Esc, the button or a click outside */
  #player { padding: 0; border: 1px solid var(--line); background: #000; color: var(--fg);
            width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: hidden; }
  #player::backdrop { background: rgba(3,5,9,.82); }
  #player .bar { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  #player .t { font-weight: 600; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #player .bar button { margin-left: auto; font: 600 16px var(--sans); color: var(--fg); background: none; border: 1px solid var(--faint);
                        width: 36px; height: 32px; cursor: pointer; }
  #player video { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 90px); background: #000; }
  @media (prefers-reduced-motion: no-preference) {
    #player[open] { animation: pop .18s ease-out; }
    @keyframes pop { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
  }

  .thanks p { margin: 0 0 10px; color: var(--dim); font-size: 15px; line-height: 1.55; max-width: 52em; }

  /* ---------------------------------------------------------------- contact */
  .people { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px 28px; }
  .people div { min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .people .n { font-weight: 600; }
  .people .r { color: var(--dim); font-size: 15px; }
  .people a { font: 15px var(--mono); overflow-wrap: anywhere; }
  .people a.who { font: inherit; color: var(--fg); text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .turn h2 a { color: inherit; text-decoration: none; }
  .turn h2 a:hover { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 5px; }
  .turn figcaption a, .lead a { color: var(--accText); }

  .builders { margin-top: 56px; padding: 28px; background: var(--plate); color: var(--plateFg);
              display: flex; flex-wrap: wrap; align-items: center; gap: 20px 48px; }
  .builders .marks { display: flex; flex-wrap: wrap; align-items: center; gap: 24px 48px; }
  .builders .marks img { height: 72px; width: auto; display: block; }
  .builders p { margin: 0; flex: 1 1 22em; min-width: 0; font-size: 15px; line-height: 1.55; }
  .builders a { color: #1f5fbf; }

  footer { margin-top: 56px; background: var(--foot); border-top: 1px solid var(--line); }
  footer .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; padding-block: 22px; }
  footer .fundline { color: var(--dim); font-size: 14px; max-width: 34em; }
  footer .fx { margin-left: auto; }
  footer img { height: 34px; display: block; }
  @media (max-width: 860px) {
    .turn, .turn:nth-child(even) { grid-template-columns: 1fr; }
    .turn:nth-child(even) .text { order: 0; }
    .turn figure { margin-inline: -16px; }
    #overview .video, .videos { grid-template-columns: 1fr; }
    .builders .marks img { height: 52px; }
    footer .fx { margin-left: 0; }
  }
</style>
</head>

<script>
/*
 * The story. One turn per idea, each with the graphic from the slide that made the same point.
 * Every figure here is one the videos state, sourced to D5.1; `from` names the video the graphic is
 * lifted from, and a caption says so when the graphic's numbers are an illustration.
 */
const STORY = [
  {img: "problem", from: "hub",
   en: {h: "The problem",
        p: ["Every vessel at sea reports where it is, every few seconds. Watching that by rule means writing a limit for each case somebody has already thought of.",
            "Set the limit loose and the case is missed. Set it tight and the desk fills with false alarms. Every new trick needs a new rule, written after it has worked."],
        c: "The rulebook, in the overview video. The counts are an illustration."},
   el: {h: "Το πρόβλημα",
        p: ["Κάθε σκάφος στη θάλασσα αναφέρει πού βρίσκεται, κάθε λίγα δευτερόλεπτα. Ο έλεγχος με κανόνες σημαίνει ένα γραμμένο όριο για κάθε περίπτωση που έχει ήδη σκεφτεί κάποιος.",
            "Αν το όριο είναι χαλαρό, η περίπτωση χάνεται. Αν είναι αυστηρό, η κονσόλα γεμίζει ψευδείς συναγερμούς. Κάθε νέο τέχνασμα χρειάζεται νέο κανόνα, γραμμένο αφού έχει ήδη πετύχει."],
        c: "Οι κανόνες, στο βίντεο επισκόπησης. Οι αριθμοί είναι ενδεικτικοί."}},
  {img: "normal", from: "modelling",
   en: {h: "Learning normal",
        p: ["SEAVISTA learns how ships normally move, from recorded traffic. Of every vessel, with every report, it asks whether this manoeuvre is ordinary, whether this continuation is ordinary, and whether vessels are ever here.",
            "One calculation answers all three, and it has room for more. The traffic around a vessel, the water, the ports and the destination it broadcasts all enter the same calculation as inputs."],
        c: "The futures the model imagines for one hour of a voyage, and what the ship actually did."},
   el: {h: "Μαθαίνοντας το σύνηθες",
        p: ["Το SEAVISTA μαθαίνει πώς κινούνται συνήθως τα πλοία, από καταγεγραμμένη κυκλοφορία. Για κάθε σκάφος, σε κάθε αναφορά, ρωτά αν ο ελιγμός αυτός είναι συνηθισμένος, αν η συνέχειά του είναι συνηθισμένη και αν περνούν ποτέ σκάφη από εκεί.",
            "Ένας υπολογισμός απαντά και στα τρία, και έχει χώρο για περισσότερα. Η κυκλοφορία γύρω από το σκάφος, η θάλασσα, τα λιμάνια και ο προορισμός που δηλώνει αποτελούν δεδομένα εισόδου στον ίδιο υπολογισμό."],
        c: "Οι πιθανές συνέχειες που φαντάζεται το μοντέλο για μία ώρα ταξιδιού, και τι έκανε στην πράξη το πλοίο."}},
  {img: "agent", from: "awareness",
   en: {h: "The agent works the case",
        p: ["The scoring is tuned to raise anything unusual, more than any officer could read. Each flag opens an investigation by an AI agent, with the full context of the water and of the vessel.",
            "For each case the agent writes a short program and runs it. It queries the traffic, runs the forecast, plots the vessel's scores, maps the water and reads its own charts. The analysis changes with the evidence."],
        c: "A real session. The agent's own map and chart of a pilot boat meeting a tanker."},
   el: {h: "Ο AI agent διερευνά την περίπτωση",
        p: ["Η βαθμολόγηση είναι ρυθμισμένη ώστε να επισημαίνει οτιδήποτε ασυνήθιστο, περισσότερα απ' όσα θα μπορούσε να διαβάσει οποιοσδήποτε αξιωματικός. Κάθε επισήμανση ανοίγει μια διερεύνηση από έναν AI agent, με πλήρη εικόνα της θάλασσας και του σκάφους.",
            "Για κάθε περίπτωση ο AI agent γράφει ένα σύντομο πρόγραμμα και το τρέχει. Ανατρέχει στα δεδομένα κυκλοφορίας, τρέχει την πρόβλεψη, αποτυπώνει σε διάγραμμα τις βαθμολογίες του σκάφους, χαρτογραφεί τη θάλασσα και διαβάζει τα δικά του διαγράμματα. Η ανάλυση αλλάζει ανάλογα με τα στοιχεία."],
        c: "Πραγματική εκτέλεση. Ο χάρτης και το διάγραμμα του ίδιου του AI agent, για μια πιλοτίνα που συναντά ένα δεξαμενόπλοιο."}},
  {img: "desk", from: "hub",
   en: {h: "No backlog on the desk",
        p: ["Without a layer like this, every alert waits for a person. The queue grows faster than a watch can clear it, and the watch spends its hours on alerts that come to nothing.",
            "With it, the agent works every alert, and the officer on watch works a short list. Each case arrives with its evidence, its cited reasons and the one change that would turn the assessment around."],
        c: "The desk, in the overview video. The counts are an illustration."},
   el: {h: "Χωρίς εκκρεμότητες στην κονσόλα",
        p: ["Χωρίς ένα τέτοιο ενδιάμεσο επίπεδο, κάθε ειδοποίηση περιμένει έναν άνθρωπο. Η ουρά μεγαλώνει πιο γρήγορα απ' όσο μπορεί να την αδειάσει μια βάρδια, και η βάρδια ξοδεύει τις ώρες της σε ειδοποιήσεις που δεν οδηγούν πουθενά.",
            "Με αυτό το επίπεδο, ο AI agent επεξεργάζεται κάθε ειδοποίηση και ο αξιωματικός βάρδιας μια σύντομη λίστα. Κάθε περίπτωση φτάνει με τα στοιχεία της, τους λόγους της με τις παραπομπές τους, και τη μία αλλαγή που θα αντέστρεφε την εκτίμηση."],
        c: "Η κονσόλα, στο βίντεο επισκόπησης. Οι αριθμοί είναι ενδεικτικοί."}},
  {img: "reasons", from: "results",
   en: {h: "Every call traceable",
        p: ["The agent's assessment cites every rule that fired. In every labelled case, none was dropped. The officer's verdict is the decision, and nothing in the queue becomes final without it. Any call can be traced back to the rules behind it.",
            "The agent judged two labelled sets of ordinary traffic, 72 cases and 69, three times over. None of that ordinary traffic reached the officer, in any pass. An alert reached a person a median of 84 seconds after its signal came in, investigated and written up, with the queue counted in."],
        c: "The reasons, in the video on what we measured."},
   el: {h: "Κάθε εκτίμηση ιχνηλατήσιμη",
        p: ["Η εκτίμηση του AI agent παραθέτει κάθε κανόνα που ενεργοποιήθηκε. Σε κάθε περίπτωση με γνωστή ετικέτα, κανένας δεν παραλείφθηκε. Η κρίση του αξιωματικού είναι η απόφαση, και τίποτα στην ουρά δεν οριστικοποιείται χωρίς αυτήν. Κάθε εκτίμηση μπορεί να ιχνηλατηθεί ως τους κανόνες πίσω της.",
            "Ο AI agent έκρινε δύο σύνολα συνήθους κυκλοφορίας με γνωστή ετικέτα, 72 και 69 περιπτώσεις, τρεις φορές το καθένα. Τίποτα από αυτήν τη συνήθη κυκλοφορία δεν έφτασε στον αξιωματικό, σε κανένα πέρασμα. Μια ειδοποίηση έφτανε σε άνθρωπο σε διάμεσο χρόνο 84 δευτερολέπτων από τη λήψη του σήματος, διερευνημένη και με γραμμένη αναφορά, με τον χρόνο αναμονής στην ουρά συνυπολογισμένο."],
        c: "Οι λόγοι, στο βίντεο για όσα μετρήσαμε."}},
  {img: "seas", from: "results",
   en: {h: "A new sea area, learned in under four hours",
        p: ["All of it runs on one workstation. It carries about 6,000 vessel updates a second, each a full pass through every model, and about 48 times that with requests grouped into batches.",
            "One model learned four national sea areas at once. On Danish water it beats the model trained on Danish water alone, 13.3 m against 38.8 m in mean curve error. Adding a sea area takes one full refresh of the model, under four hours on the same workstation."],
        c: "Four national sea areas, one model, in the video on what we measured. Recorded traffic from the [Danish Maritime Authority](https://www.dma.dk/safety-at-sea/navigational-information/ais-data), [NOAA Marine Cadastre](https://hub.marinecadastre.gov/pages/vesseltraffic), [Fintraffic Digitraffic](https://www.digitraffic.fi/en/marine-traffic/) and DTU."},
   el: {h: "Νέα θαλάσσια περιοχή στο μοντέλο σε λιγότερο από τέσσερις ώρες",
        p: ["Όλο το σύστημα τρέχει σε έναν σταθμό εργασίας. Επεξεργάζεται περίπου 6.000 ενημερώσεις σκαφών το δευτερόλεπτο, καθεμία με πλήρη διέλευση από όλα τα μοντέλα, και περίπου 48 φορές περισσότερες όταν τα αιτήματα ομαδοποιούνται σε δέσμες.",
            "Ένα μοντέλο έμαθε ταυτόχρονα τέσσερις εθνικές θαλάσσιες περιοχές. Στα δανικά ύδατα ξεπερνά το μοντέλο που εκπαιδεύτηκε μόνο σε αυτά, 13,3 m έναντι 38,8 m μέσου σφάλματος καμπύλης. Η προσθήκη μιας θαλάσσιας περιοχής απαιτεί μία πλήρη επανεκπαίδευση του μοντέλου, λιγότερο από τέσσερις ώρες στον ίδιο σταθμό εργασίας."],

// the hash is either a language (#el, #en) or a place on the page (#turn-agent, #v-hub)
const hash0 = location.hash.slice(1);
let lang = (["el", "en"].includes(hash0) && hash0) || ((navigator.language || "").startsWith("el") ? "el" : "en");
let manifest = null;
const meta = {};
// text with [label](url) links, built as nodes, never as HTML
function put(el, str) {
  el.textContent = "";
  let last = 0;
  for (const m of str.matchAll(/\[([^\]]+)\]\(([^)\s]+)\)/g)) {
    el.append(str.slice(last, m.index));
    const a = document.createElement("a"); a.href = m[2]; a.textContent = m[1];
    if (/^https?:/.test(m[2])) { a.target = "_blank"; a.rel = "noopener"; }
    el.append(a); last = m.index + m[0].length;
  }
  el.append(str.slice(last));
}
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;

// the story's rows, built once; text is filled per language
const story = document.getElementById("story");
for (const s of STORY) {
  const row = document.createElement("article");
  row.className = "turn"; row.id = "turn-" + s.img;
  row.innerHTML = `<div class="text"><h2><a href="#turn-${s.img}"></a></h2></div>
    <figure><img src="story/${s.img}.jpg" alt=""><figcaption><span></span> <button type="button"></button></figcaption></figure>`;
  row.querySelector("button").addEventListener("click", () => playVideo(s.from));
  s.row = row; story.append(row);
}

const player = document.getElementById("player"), pv = document.getElementById("player-video");
function playVideo(id) {
  const v = manifest && manifest.videos.find((x) => x.id === id);
  if (!v) return;
  document.getElementById("player-title").textContent = v.title[lang];
  pv.poster = `media/${id}.jpg`;
  if (!pv.src.endsWith(`media/${id}.mp4`)) pv.src = `media/${id}.mp4`;
  if (!player.open) player.showModal();
  pv.play().catch(() => {});
}
player.addEventListener("close", () => pv.pause());
document.getElementById("player-close").addEventListener("click", () => player.close());
player.addEventListener("click", (e) => { if (e.target === player) player.close(); });

function render() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-t]")) put(el, T[lang][el.dataset.t]);
  for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", b.dataset.lang === lang);
  for (const s of STORY) {
    const t = s[lang], text = s.row.querySelector(".text");
    const h = text.querySelector("h2 a"); h.textContent = t.h;
    text.querySelectorAll("p").forEach((p) => p.remove());
    for (const para of t.p) { const p = document.createElement("p"); p.textContent = para; text.append(p); }
    s.row.querySelector("img").alt = t.c.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
    put(s.row.querySelector("figcaption span"), t.c);
    s.row.querySelector("figcaption button").textContent = T[lang].watch + " ▶";
  }
  const cta = document.getElementById("cta");
  cta.textContent = T[lang].cta + " ▶";
  if (!manifest) return;
  const over = manifest.videos.find((v) => v.role === "overview");
  if (over && meta[over.id]) { const l = document.createElement("span"); l.className = "len"; l.textContent = mmss(meta[over.id].seconds); cta.append(l); }
  for (const v of manifest.videos) {
    const card = document.getElementById("v-" + v.id);
    card.querySelector("h3 .t").textContent = v.title[lang];
    card.querySelector("p").textContent = v.blurb[lang];
    const play = card.querySelector(".play"); if (play) play.textContent = T[lang].play;
  }
}

async function load() {
  manifest = await (await fetch("videos.json")).json();
  const grid = document.getElementById("videos");
  for (const v of manifest.videos) {
    const m = meta[v.id] = await fetch(`media/${v.id}.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    const card = document.createElement("article");
    card.className = "video"; card.id = "v-" + v.id;
    card.innerHTML = `<div class="media"><img src="media/${v.id}.jpg" alt=""><span class="play"></span></div>
      <div><h3><span class="t"></span>${m ? `<span class="len">${mmss(m.seconds)}</span>` : ""}</h3><p></p>
</div>`;
    const media = card.querySelector(".media");
    media.tabIndex = 0; media.setAttribute("role", "button");
    media.addEventListener("click", () => playVideo(v.id));
    media.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playVideo(v.id); } });
    (v.role === "overview" ? document.getElementById("overview") : grid).append(card);
  }
  render();
  // arriving on a link to a place on the page
  const at = hash0 && !["el", "en"].includes(hash0) && document.getElementById(hash0);
  if (at) at.scrollIntoView({block: "center"});
  if (hash0.startsWith("v-")) playVideo(hash0.slice(2));
}

document.getElementById("cta").addEventListener("click", () => {
  const over = manifest && manifest.videos.find((v) => v.role === "overview");
  if (over) playVideo(over.id);
});
for (const b of document.querySelectorAll(".lang button"))
  b.addEventListener("click", () => { lang = b.dataset.lang; render(); try { history.replaceState(null, "", "#" + lang); } catch {} });
render(); load();
</script>
